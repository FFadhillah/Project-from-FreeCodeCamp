<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/PROJECT CSS/CAFE MENU/style.css">
    <title>Cafe Menu</title>
</head>
<body>
    <div class="menu">
        <h1>Kaki Mountain Cafe</h1>
        <p class="year">Est. 2026</p>
        <hr>
        <section>
            <h2>Food</h2>
            <!--Icon image-->
             <img src="/PROJECT CSS/CAFE MENU/asset/dish.png">
            <article class="items">
                <p class="type-food">Pizza</p>
                <p class="price">Rp. 25.000</p>
            </article>
            <article class="items">
                <p class="type-food">Spaghetti</p>
                <p class="price">Rp. 20.000</p>
            </article>
            <article class="items">
                <p class="type-food">Salad</p>
                <p class="price">Rp. 15.000</p>
            </article>
            <article class="items">
                <p class="type-food">Burger</p>
                <p class="price">Rp. 30.000</p>
            </article>
        </section>
        <section>
            <h2>Drinks</h2>
            <!--Icon image-->
            <img src="/PROJECT CSS/CAFE MENU/asset/coffee-cup.png">
            <article class="items">
                <p class="type-food">French Vanilla Latte</p>
                <p class="price">Rp. 30.000</p>
            </article>
            <article class="items">
                <p class="type-food">Caramel Macchiato</p>
                <p class="price">Rp. 35.000</p>
            </article>
            <article class="items">
                <p class="type-food">Mocha</p>
                <p class="price">Rp. 35.000</p>
            </article>
            <article class="items">
                <p class="type-food">Americano</p>
                <p class="price">Rp. 30.000</p>
            </article>
        </section>
        <hr class="bottom-line">
        <footer>
            <address>
                <p><a href="#">Visit our website for more information</a></p>
                <p>Jl raya Lembang no 123456</p>
            </address>
        </footer>
    </div>
</body>
</html>
